name: Versioned release backup

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optionpilot-versioned-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version (e.g. 2.0.0), got: $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether version tag already exists
        id: tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.tag.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.tag.outputs.exists != 'true'
        run: npm ci

      - name: Run tests
        if: steps.tag.outputs.exists != 'true'
        run: npm test

      - name: Build production application
        if: steps.tag.outputs.exists != 'true'
        run: npm run build

      - name: Create immutable version tag
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "OptionPilot $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release with downloadable source archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
          else
            gh release create "$TAG" --verify-tag --title "OptionPilot $TAG" --generate-notes
          fi
